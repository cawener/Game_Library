<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelikirjasto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500&display=swap">
<style>
  :root { --bg: #1b1511; --panel: #261d16; --brass: #c9a14a; --brass-light: #ead08a; --text: #eddcb6; --muted: #a8957a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 "Alegreya Sans", system-ui, sans-serif; padding: 48px max(16px, env(safe-area-inset-left, 0px)); }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-family: Cinzel, Georgia, serif; color: var(--brass-light); letter-spacing: .08em; margin: 0 0 4px; font-size: 2rem; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  a.game { display: block; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid #5a4424; border-radius: 8px; padding: 20px; transition: border-color .15s, transform .15s; }
  a.game:hover, a.game:focus-visible { border-color: var(--brass); transform: translateY(-2px); outline: none; }
  a.game h2 { font-family: Cinzel, Georgia, serif; color: var(--brass-light); margin: 0 0 6px; font-size: 1.25rem; letter-spacing: .05em; }
  a.game p { margin: 0; color: var(--muted); font-size: .95rem; }
  .ver { color: var(--muted); font-size: .85rem; margin-left: 8px; }
  .play { display: inline-block; margin-top: 14px; color: var(--brass); font-weight: 500; }
</style>
</head>
<body>
<main>
  <h1>Pelikirjasto</h1>
  <p class="lead">Selaimessa toimivia pelejä. Valitse peli, niin se aukeaa suoraan.</p>
  <div class="games">
    <a class="game" href="Hoyrytehdas/">
      <h2>Höyrytehdas</h2>
      <p>Steampunk-tehdasautomaatio: louhi, sulata ja kokoa osia höyryvoimalla, rakenna rautateitä ja ilmalaivoja ja nosta Aurora taivaalle.</p>
      <span class="play">Pelaa →</span> <span class="ver">Versio 0.50.8</span>
    </a>
  </div>
</main>
</body>
</html>
